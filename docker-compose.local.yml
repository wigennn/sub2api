# Sub2API local deployment.
# Builds the current checkout and exposes the application on port 8070.
#
# Start:
#   docker compose up -d --build
#
# The default database password is for local use. Set POSTGRES_PASSWORD in
# the environment or a root-level .env file before using this in production.

name: sub2api-local

services:
  sub2api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NPM_CONFIG_REGISTRY: ${NPM_CONFIG_REGISTRY:-https://registry.npmmirror.com}
        GOPROXY: ${GOPROXY:-https://goproxy.cn,direct}
    image: sub2api:local
    container_name: sub2api
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ulimits:
      nofile:
        soft: 100000
        hard: 100000
    ports:
      - "${BIND_HOST:-0.0.0.0}:8070:8070"
    volumes:
      - sub2api_data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      AUTO_SETUP: "true"
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: "8070"
      SERVER_MODE: ${SERVER_MODE:-release}
      ENABLE_SERVER_TIMING: ${ENABLE_SERVER_TIMING:-false}
      RUN_MODE: ${RUN_MODE:-standard}
      SIMPLE_MODE_AUTO_CREATE_DEFAULT_GROUPS: ${SIMPLE_MODE_AUTO_CREATE_DEFAULT_GROUPS:-}
      SIMPLE_MODE_KEY_RATE_LIMIT_ENABLED: ${SIMPLE_MODE_KEY_RATE_LIMIT_ENABLED:-false}

      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      DATABASE_USER: ${POSTGRES_USER:-sub2api}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-change_this_secure_password}
      DATABASE_DBNAME: ${POSTGRES_DB:-sub2api}
      DATABASE_SSLMODE: disable
      DATABASE_MAX_OPEN_CONNS: ${DATABASE_MAX_OPEN_CONNS:-50}
      DATABASE_MAX_IDLE_CONNS: ${DATABASE_MAX_IDLE_CONNS:-10}
      DATABASE_CONN_MAX_LIFETIME_MINUTES: ${DATABASE_CONN_MAX_LIFETIME_MINUTES:-30}
      DATABASE_CONN_MAX_IDLE_TIME_MINUTES: ${DATABASE_CONN_MAX_IDLE_TIME_MINUTES:-5}

      REDIS_HOST: 192.168.31.42
      REDIS_PORT: "6379"
      REDIS_USERNAME: ${REDIS_USERNAME:-}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_DB: ${REDIS_DB:-0}
      REDIS_POOL_SIZE: ${REDIS_POOL_SIZE:-1024}
      REDIS_MIN_IDLE_CONNS: ${REDIS_MIN_IDLE_CONNS:-10}
      REDIS_ENABLE_TLS: ${REDIS_ENABLE_TLS:-false}

      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      JWT_SECRET: ${JWT_SECRET:-}
      JWT_EXPIRE_HOUR: ${JWT_EXPIRE_HOUR:-24}
      TOTP_ENCRYPTION_KEY: ${TOTP_ENCRYPTION_KEY:-}
      SETUP_MIGRATION_TIMEOUT_SECONDS: ${SETUP_MIGRATION_TIMEOUT_SECONDS:-0}
      TZ: ${TZ:-Asia/Shanghai}

      MAIN_SITE_ENABLED: ${MAIN_SITE_ENABLED:-true}
      MAIN_SITE_ONLY_LOGIN: ${MAIN_SITE_ONLY_LOGIN:-true}
      MAIN_SITE_BASE_URL: ${MAIN_SITE_BASE_URL:-http://192.168.31.42:8080}
      MAIN_SITE_USER_INFO_PATH: ${MAIN_SITE_USER_INFO_PATH:-/api/auth/me}
      MAIN_SITE_TIMEOUT_SECONDS: ${MAIN_SITE_TIMEOUT_SECONDS:-5}

      UPDATE_GITHUB_TOKEN: ${UPDATE_GITHUB_TOKEN:-}
      UPDATE_PROXY_URL: ${UPDATE_PROXY_URL:-}
      GATEWAY_FORCE_CODEX_CLI: ${GATEWAY_FORCE_CODEX_CLI:-false}
      GATEWAY_OPENAI_COMPACT_MODEL: ${GATEWAY_OPENAI_COMPACT_MODEL:-gpt-5.5}
      SUB2API_IMAGES_MAIN_MODEL: ${SUB2API_IMAGES_MAIN_MODEL:-gpt-5.6-luna}
      GATEWAY_MAX_BODY_SIZE: ${GATEWAY_MAX_BODY_SIZE:-268435456}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-T", "5", "-O", "/dev/null", "http://127.0.0.1:8070/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

  postgres:
    image: postgres:18-alpine
    container_name: sub2api-postgres
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 100000
        hard: 100000
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sub2api}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_this_secure_password}
      POSTGRES_DB: ${POSTGRES_DB:-sub2api}
      PGDATA: /var/lib/postgresql/data
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 60s

volumes:
  sub2api_data:
    driver: local
  postgres_data:
    driver: local
